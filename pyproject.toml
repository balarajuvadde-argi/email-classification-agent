[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-classification-agent"
version = "3.0.0"
description = "Multi-user prompt-driven Gmail label classification web application and legacy CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "RG Family" }]
dependencies = [
  "boto3>=1.35,<2",
  "cryptography>=44,<51",
  "fastapi>=0.115,<1",
  "google-api-python-client>=2.160,<3",
  "google-auth>=2.38,<3",
  "google-auth-oauthlib>=1.2,<2",
  "jinja2>=3.1,<4",
  "mangum>=0.19,<1",
  "openai>=2.45,<3",
  "pydantic>=2.11,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "PyYAML>=6,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
email-classifier = "email_classification_agent.cli:main"
email-classifier-web = "email_classification_agent.web_local:main"
email-classifier-scheduled = "email_classification_agent.scheduled_runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
email_classification_agent = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
